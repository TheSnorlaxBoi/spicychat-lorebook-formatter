<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spicychat Lorebook Formatter</title>
  <style>
    :root {
      --bg: #12131c;
      --card: #1c1e2d;
      --accent: #ff477e;
      --accent-hover: #ff2a66;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --border: #2e3248;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
    }
    h1 { color: #fff; margin-bottom: 8px; }
    p.subtitle { color: var(--muted); margin-bottom: 24px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }
    label { display: block; font-weight: 600; margin-bottom: 8px; }
    input[type="text"], input[type="file"] {
      width: 100%;
      padding: 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      box-sizing: border-box;
      margin-bottom: 12px;
    }
    .btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      font-size: 1rem;
      transition: background 0.2s;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn:disabled { background: #555; cursor: not-allowed; }
    #progress-container { margin-top: 15px; display: none; }
    .progress-bar-bg {
      background: var(--bg);
      height: 12px;
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 8px;
    }
    .progress-bar {
      background: var(--accent);
      height: 100%;
      width: 0%;
      transition: width 0.3s;
    }
    #log {
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 10px;
      height: 180px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 0.85rem;
      border-radius: 6px;
      color: var(--muted);
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <h1>Spicychat Lorebook Reformatter</h1>
  <p class="subtitle">Condense lorebook entry contents to &le;1,000 characters using your KoboldCPP API endpoint while keeping titles, keywords, and images untouched.</p>

  <div class="card">
    <label for="apiUrl">KoboldCPP API URL (from Colab / trycloudflare)</label>
    <input type="text" id="apiUrl" placeholder="https://xxxx-xxx-xxx.trycloudflare.com or http://localhost:5001" />

    <label for="fileInput">Select Lorebook JSON File</label>
    <input type="file" id="fileInput" accept=".json" />

    <button id="startBtn" class="btn">Process Lorebook</button>

    <div id="progress-container">
      <div class="progress-bar-bg"><div id="progress-bar" class="progress-bar"></div></div>
      <div id="statusText" style="font-size: 0.9rem; text-align: center;">Processing 0 / 0...</div>
    </div>
  </div>

  <div class="card" id="logCard" style="display:none;">
    <label>Process Logs</label>
    <div id="log"></div>
    <button id="downloadBtn" class="btn" style="margin-top: 15px; display: none;">Download Formatted JSON</button>
  </div>

  <script>
    let rawJsonData = null;

    document.getElementById('fileInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        try {
          rawJsonData = JSON.parse(evt.target.result);
          logMsg(`Loaded file: ${file.name}`);
        } catch (err) {
          alert("Invalid JSON file.");
        }
      };
      reader.readAsText(file);
    });

    function logMsg(msg) {
      const log = document.getElementById('log');
      document.getElementById('logCard').style.display = 'block';
      log.innerHTML += `<div>> ${msg}</div>`;
      log.scrollTop = log.scrollHeight;
    }

    async function condenseText(text, apiUrl) {
      const endpoint = apiUrl.replace(/\/$/, "") + "/api/v1/generate";
      const prompt = `### Instruction:\nSummarize and condense the following world info entry. Retain all key facts, specifics, names, and context, but strictly keep the output brief and under 900 characters.\n\n### Input:\n${text}\n\n### Response:\n`;

      try {
        const res = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            prompt: prompt,
            max_context_length: 2048,
            max_length: 300,
            temperature: 0.3,
            stop_sequence: ["### Instruction:", "### Response:"]
          })
        });

        if (!res.ok) throw new Error(`HTTP error ${res.status}`);
        const data = await res.json();
        let result = data.results[0].text.trim();

        // Hard cap trim at 1000 chars if the AI goes slightly over
        if (result.length > 1000) {
          result = result.substring(0, 997) + "...";
        }
        return result;
      } catch (e) {
        logMsg(`Error summarizing: ${e.message}. Keeping original truncated to 1000 chars.`);
        return text.substring(0, 997) + "...";
      }
    }

    document.getElementById('startBtn').addEventListener('click', async () => {
      let apiUrl = document.getElementById('apiUrl').value.trim();
      if (!apiUrl) {
        alert("Please enter a KoboldCPP API URL.");
        return;
      }
      if (!rawJsonData) {
        alert("Please upload a lorebook JSON first.");
        return;
      }

      document.getElementById('startBtn').disabled = true;
      document.getElementById('progress-container').style.display = 'block';

      // Parse lorebook entries (handles both array and object structures)
      let entries = [];
      let isObjectDict = false;

      if (Array.isArray(rawJsonData.entries)) {
        entries = rawJsonData.entries;
      } else if (rawJsonData.entries && typeof rawJsonData.entries === 'object') {
        entries = Object.values(rawJsonData.entries);
        isObjectDict = true;
      } else if (Array.isArray(rawJsonData)) {
        entries = rawJsonData;
      } else {
        alert("Could not identify entries array in JSON.");
        document.getElementById('startBtn').disabled = false;
        return;
      }

      const total = entries.length;
      logMsg(`Starting processing for ${total} entries...`);

      for (let i = 0; i < total; i++) {
        let entry = entries[i];
        let content = entry.content || entry.text || "";

        if (content.length > 1000) {
          logMsg(`Entry ${i + 1}/${total} ("${entry.comment || entry.name || 'Untitled'}") is ${content.length} chars. Condensing...`);
          let condensed = await condenseText(content, apiUrl);
          
          if (entry.content !== undefined) entry.content = condensed;
          if (entry.text !== undefined) entry.text = condensed;
        } else {
          logMsg(`Entry ${i + 1}/${total} is already under 1000 chars (${content.length} chars). Skipped.`);
        }

        // Update progress
        const percent = Math.round(((i + 1) / total) * 100);
        document.getElementById('progress-bar').style.width = percent + "%";
        document.getElementById('statusText').innerText = `Processed ${i + 1} / ${total} (${percent}%)`;
      }

      logMsg("All entries processed!");
      
      const downloadBtn = document.getElementById('downloadBtn');
      downloadBtn.style.display = 'block';
      downloadBtn.onclick = () => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(rawJsonData, null, 2));
        const dlAnchor = document.createElement('a');
        dlAnchor.setAttribute("href", dataStr);
        dlAnchor.setAttribute("download", "spicychat_lorebook_formatted.json");
        document.body.appendChild(dlAnchor);
        dlAnchor.click();
        dlAnchor.remove();
      };

      document.getElementById('startBtn').disabled = false;
    });
  </script>
</body>
</html>
